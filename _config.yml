title: "Marcus Turner-Wood"
description: "Essays on philosophy, science, and culture."
url: "https://marcusturnerwood.github.io"
theme: minima

author: "Marcus Turner-Wood"

show_excerpts: true

minima:
  social_links:
    - { platform: linkedin, user_url: "https://www.linkedin.com/in/marcus-turner-wood/" }

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /projects/:name/

header_pages:
  - articles.html
  - projects.html
  - about.html
  - themes.html

# Comments + reactions (likes), via giscus (github.com/apps/giscus), backed by GitHub Discussions.
# Setup steps (one-time, done on github.com — see README):
#   1. Enable Discussions on the repo (Settings > General > Features).
#   2. Install the giscus app on this repo: https://github.com/apps/giscus
#   3. Go to https://giscus.app, fill in this repo, pick a Discussion category
#      (a dedicated "Comments" category works well), and copy the four values
#      it generates (repo_id, category, category_id) into the fields below.
giscus:
  repo: "marcusturnerwood/marcusturnerwood.github.io"
  repo_id: "R_kgDORKa5Qw"
  category: "General"
  category_id: "DIC_kwDORKa5Q84DBDrX"

# Email subscription (replaces RSS as the primary "follow this blog" option), via Buttondown.
# Setup: sign up free at https://buttondown.com, then set your username below.
# Bonus: Buttondown can also auto-import new posts from /feed.xml and email them out,
# so the existing RSS feed doesn't go to waste even though readers just see an email box.
buttondown:
  username: "marcusturnerwood"

