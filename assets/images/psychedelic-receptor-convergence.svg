<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Two unrelated lineages converging on one ancient receptor</title>
  <desc id="d">Claviceps purpurea and Psilocybe fungi, evolving independently for unrelated defensive reasons, both produce alkaloids that strongly activate the 5-HT2A-type receptor, which predates the vertebrate/invertebrate split. A further arrow shows humans as an incidental, downstream target.</desc>
  <rect x="0" y="0" width="900" height="400" fill="#f8f9fa"/>

  <path d="M 270 120 C 340 120, 340 200, 400 205" fill="none" stroke="#dadce0" stroke-width="2"/>
  <path d="M 270 330 C 340 330, 340 260, 400 245" fill="none" stroke="#dadce0" stroke-width="2"/>
  <path d="M 660 225 C 675 225, 675 225, 690 225" fill="none" stroke="#dadce0" stroke-width="2"/>

  <rect x="30" y="80" width="240" height="80" rx="10" fill="#ffffff" stroke="#dadce0"/>
  <text x="150" y="112" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124">Claviceps purpurea</text>
  <text x="150" y="132" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">ergot fungus, cereal pathogen</text>
  <text x="150" y="149" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">ergot alkaloids, an anti-herbivore defence</text>

  <rect x="30" y="290" width="240" height="80" rx="10" fill="#ffffff" stroke="#dadce0"/>
  <text x="150" y="322" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124">Psilocybe spp.</text>
  <text x="150" y="342" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">mushroom genus, ~65 Myr lineage</text>
  <text x="150" y="359" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">psilocybin, likely an anti-grazing defence</text>

  <rect x="400" y="170" width="260" height="110" rx="10" fill="rgba(230,57,70,0.10)" stroke="#e63946" stroke-width="1.5"/>
  <text x="530" y="205" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124">5-HT2A-type receptor</text>
  <text x="530" y="228" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">a G-protein-coupled serotonin</text>
  <text x="530" y="245" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">receptor family &gt;600 Myr old,</text>
  <text x="530" y="262" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">pre-dating vertebrates entirely</text>

  <rect x="690" y="185" width="180" height="80" rx="10" fill="#ffffff" stroke="#dadce0"/>
  <text x="780" y="217" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124">Homo sapiens</text>
  <text x="780" y="237" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">an incidental,</text>
  <text x="780" y="254" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">downstream target</text>
</svg>
