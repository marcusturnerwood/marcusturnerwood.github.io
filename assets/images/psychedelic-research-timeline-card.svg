<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">The boom, the freeze, and the reopening of psychedelic research</title>
  <desc id="d">A schematic curve of psychedelic research activity from 1943 to the present, rising through the 1950s and 1960s, collapsing sharply around 1970, remaining near zero for two decades, then slowly reopening from 1990 onward.</desc>
  <rect x="0" y="0" width="900" height="400" fill="#f8f9fa"/>

  <line x1="70" y1="40" x2="70" y2="300" stroke="#dadce0" stroke-width="1"/>
  <line x1="70" y1="300" x2="850" y2="300" stroke="#dadce0" stroke-width="1"/>
  <text x="30" y="44" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">high</text>
  <text x="30" y="304" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">low</text>

  <path d="M 70 290 L 130 250 L 210 150 L 300 70 L 350 60 L 400 190 L 420 275 L 460 292 L 620 292 L 680 260 L 730 235 L 800 130 L 850 90"
        fill="none" stroke="#e63946" stroke-width="3"/>

  <text x="300" y="330" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">1950s&#8211;60s boom</text>
  <text x="440" y="330" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">1970 freeze</text>
  <text x="750" y="330" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">1990s&#8211;2020s reopening</text>

  <text x="450" y="370" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="600" fill="#202124">The History of Psychedelic Research</text>
</svg>
