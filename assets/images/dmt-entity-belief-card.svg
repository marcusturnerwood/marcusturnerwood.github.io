<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">What DMT users believed about the entity they encountered</title>
  <desc id="d">A bar chart showing survey results on what people believed about an entity encountered during a DMT experience: most described it as real and existing in a different dimension, either alone or alongside normal reality.</desc>
  <rect x="0" y="0" width="900" height="400" fill="#f8f9fa"/>

  <line x1="70" y1="40" x2="70" y2="290" stroke="#dadce0" stroke-width="1"/>
  <line x1="70" y1="290" x2="850" y2="290" stroke="#dadce0" stroke-width="1"/>
  <text x="30" y="44" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">50%</text>
  <text x="38" y="168" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">25%</text>
  <text x="46" y="294" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">0%</text>

  <rect x="120" y="55" width="130" height="235" fill="#6d28d9" fill-opacity="0.85"/>
  <text x="185" y="305" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">Real, different</text>
  <text x="185" y="320" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">dimension</text>

  <rect x="310" y="167" width="130" height="123" fill="#6d28d9" fill-opacity="0.65"/>
  <text x="375" y="305" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">+ normal</text>
  <text x="375" y="320" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">reality too</text>

  <rect x="500" y="247" width="130" height="43" fill="#6d28d9" fill-opacity="0.5"/>
  <text x="565" y="305" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">Within</text>
  <text x="565" y="320" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">myself</text>

  <rect x="690" y="285" width="130" height="5" fill="#6d28d9" fill-opacity="0.5"/>
  <text x="755" y="305" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">Normal</text>
  <text x="755" y="320" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">reality only</text>

  <text x="450" y="365" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="600" fill="#202124">Machine Elves and the DMT Entity Experience</text>
</svg>
