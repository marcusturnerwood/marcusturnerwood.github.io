<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Reported clinical response across recent psychedelic trials</title>
  <desc id="d">A bar chart illustrating response rates reported across several recent psychedelic clinical trials in cancer-related distress, treatment-resistant depression, and PTSD.</desc>
  <rect x="0" y="0" width="900" height="400" fill="#f8f9fa"/>

  <line x1="70" y1="40" x2="70" y2="290" stroke="#dadce0" stroke-width="1"/>
  <line x1="70" y1="290" x2="850" y2="290" stroke="#dadce0" stroke-width="1"/>
  <text x="30" y="44" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">100%</text>
  <text x="38" y="168" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">50%</text>
  <text x="46" y="294" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#5f6368">0%</text>

  <rect x="120" y="115" width="130" height="175" fill="#e63946" fill-opacity="0.85"/>
  <text x="185" y="305" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">Cancer distress</text>
  <text x="185" y="320" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">(2016 trials)</text>

  <rect x="310" y="150" width="130" height="140" fill="#e63946" fill-opacity="0.65"/>
  <text x="375" y="305" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">Severe TRD</text>
  <text x="375" y="320" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">(2025 trial)</text>

  <rect x="500" y="150" width="130" height="140" fill="#e63946" fill-opacity="0.65"/>
  <text x="565" y="305" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">PTSD</text>
  <text x="565" y="320" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="12" fill="#334155">(2025 Phase 2)</text>

  <text x="450" y="365" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="600" fill="#202124">Modern Psychedelic Research and Its Implications</text>
</svg>
