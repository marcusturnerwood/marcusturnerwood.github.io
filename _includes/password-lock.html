<div class="password-lock" data-enc-src="{{ include.enc_src | relative_url }}" data-mode="{{ include.mode | default: 'view' }}">
  <form class="password-lock-form">
    <label class="password-lock-label" for="password-lock-input-{{ include.enc_src | slugify }}">
      {{ include.label | default: "Enter password to unlock" }}
    </label>
    <div class="password-lock-row">
      <input
        type="password"
        class="password-lock-input"
        id="password-lock-input-{{ include.enc_src | slugify }}"
        autocomplete="off"
        required>
      <button type="submit">{{ include.button_label | default: "Unlock" }}</button>
    </div>
    {%- if include.note -%}
      <p class="password-lock-note">{{ include.note }}</p>
    {%- endif -%}
  </form>
  <p class="password-lock-status" hidden></p>
  {%- unless include.mode == "download" -%}
    <div class="password-lock-viewer" hidden>
      <iframe class="password-lock-frame" title="{{ include.viewer_title | default: 'Protected document' }}"></iframe>
    </div>
  {%- endunless -%}
</div>

<script src="{{ '/assets/js/password-lock.js' | relative_url }}" defer></script>
