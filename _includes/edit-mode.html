<!--
  Dev-only inline text editor for posts/drafts.
  Only included when jekyll.environment == 'development' (see _layouts/post.html),
  so this never ships in the production build served by GitHub Pages.

  Lets you edit prose directly in the rendered page. Equations (MathJax \( \) / \[ \]
  spans) are locked as atomic, non-editable islands so they can't be corrupted by typing.
  Saving posts the changed blocks to a small local sidecar server (tools/edit_server.py)
  which splices the new text back into the source .html file on disk. Nothing else in the
  file is touched.
-->
<style>
  .edit-toolbar {
    position: fixed;
    bottom: 0.75rem;
    right: 0.75rem;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: #1f2328;
    color: #eee;
    padding: 0.4rem 0.5rem;
    border-radius: 7px;
    font-family: -apple-system, sans-serif;
    font-size: 0.78rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }
  .edit-toolbar button {
    font-size: 0.78rem;
    padding: 0.3rem 0.6rem;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    background: #2f81f7;
    color: white;
  }
  .edit-toolbar button:disabled { opacity: 0.5; cursor: default; }
  .edit-toolbar .edit-status {
    min-width: 0;
    opacity: 0.85;
  }
  .edit-toolbar .edit-status:empty { display: none; }
  .edit-block-active {
    outline: 2px dashed #2f81f7;
    outline-offset: 3px;
    background: rgba(47, 129, 247, 0.06);
  }
  .edit-block-dirty { outline-color: #d29922 !important; }
  .edit-toolbar button.edit-mark-btn {
    background: #d29922;
    padding: 0.3rem 0.45rem;
    font-size: 0.95rem;
    line-height: 1;
  }
  .edit-block-bookmark {
    position: relative;
    outline: 2px solid #d29922;
    outline-offset: 3px;
    background: rgba(210, 153, 34, 0.08);
  }
  .edit-block-bookmark::before {
    content: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="11" height="11" fill="%237a5b06"><path d="M128,64a40,40,0,1,0,40,40A40,40,0,0,0,128,64Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,128Zm0-112a88.1,88.1,0,0,0-88,88c0,31.4,14.51,64.68,42,96.25a254.19,254.19,0,0,0,41.45,38.3,8,8,0,0,0,9.18,0A254.19,254.19,0,0,0,174,200.25c27.45-31.57,42-64.85,42-96.25A88.1,88.1,0,0,0,128,16Zm0,206c-16.53-13-72-60.75-72-118a72,72,0,0,1,144,0C200,161.23,144.53,209,128,222Z"/></svg>');
    position: absolute;
    top: -1.6em;
    left: 0;
    display: inline-block;
    background: #fdf0d0;
    padding: 0.3em 0.5em;
    border-radius: 4px;
    line-height: 1;
    pointer-events: none;
    z-index: 1;
  }
  mjx-container[data-tex] {
    cursor: not-allowed;
  }
</style>
<script defer src="{{ '/assets/js/edit-mode.js' | relative_url }}"></script>
